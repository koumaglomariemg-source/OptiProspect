name: optiprospect_app
description: "OptiProspect — gestion de prospection commerciale (mobile)."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5
  intl: ^0.19.0
  url_launcher: ^6.3.1
  fl_chart: ^1.2.0
  image_picker: ^1.2.3
  drag_and_drop_lists: ^0.4.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  file_picker: ^12.0.0
  file_picker_platform_interface: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
