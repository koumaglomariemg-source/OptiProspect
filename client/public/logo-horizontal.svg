<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo mark -->
  <g transform="translate(4, 2)">
    <circle cx="30" cy="30" r="28" fill="url(#grad)"/>
    <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <!-- O -->
    <path d="M16 30 A14 14 0 1 1 44 30 A14 14 0 1 1 16 30" 
          fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="70 12" transform="rotate(-12 30 30)"/>
    
    <!-- P -->
    <g transform="translate(6, 0)">
      <path d="M36 18 V42" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M36 21 C45 21 51 27 51 34 C51 41 45 47 36 47" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Arrow -->
    <path d="M45 26 L50 30 L45 34" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="30" r="1.8" fill="#ec4899"/>
  </g>
  
  <!-- Text -->
  <text x="72" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="url(#textGrad)" letter-spacing="-0.5">OptiProspect</text>
</svg>